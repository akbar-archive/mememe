name: meme-bot

on:
  schedule:
    - cron: "7,37 * * * *" # off the :00/:30 rush, which GitHub often delays or drops
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meme-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGFLIP_USER: ${{ secrets.IMGFLIP_USER }}
          IMGFLIP_PASS: ${{ secrets.IMGFLIP_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          DRY_RUN: "false"
      - name: commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "update seen [skip ci]"
          git push
